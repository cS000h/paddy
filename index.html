<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ece4d0" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>稻</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23f6f1e3' stroke='%23b5462f' stroke-width='3'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23b5462f' font-family='serif'%3E稻%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <!-- 像素世界画在这里（src/world） -->
      <div id="stage"></div>
      <!-- 盖在世界上的三层：天色、纸的暗角、过夜时的幕 -->
      <div id="sky" class="layer sky"></div>
      <div class="layer paper"></div>
      <div id="veil" class="layer veil"></div>
      <!-- 界面面板画在这里（src/panels） -->
      <div id="ui"></div>
      <!-- 游戏起来以后 main.js 会去掉这一层。一直停在这里，多半是打开它的软件不运行网页脚本 -->
      <div
        id="boot"
        style="
          position: absolute;
          inset: 0;
          z-index: 50;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          text-align: center;
          font: 16px/1.8 serif;
          color: #2b3436;
          background: #ece4d0;
        "
      >
        <p>
          稻 · 正在打开……<br /><small
            >一直停在这里的话，说明打开它的软件不运行网页脚本。<br />请换用浏览器（Chrome、Edge、Safari）打开这个文件。</small
          >
        </p>
      </div>
    </div>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
